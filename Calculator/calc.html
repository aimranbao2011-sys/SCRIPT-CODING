<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="calcStyle.css">

    <link rel="stylesheet" href="../More/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>

<body>
    <!-- Header Container-->
    <div id="mainContainer">
        <label id="text">
            SCRIPT-CODING
            
        </label>
        <div id="nav">    
            <div>
                <i class="fa-jelly fa-regular fa-moon icon" id="dark"></i>
                
            </div>
            <div>
               <i class="fa-solid fa-house icon" onclick="window.location.href='../index.html'"></i>
                
            </div>
            
        </div>
    </div>
    <!-- /Header Container-->


    <div id="container">
        
        <div  type="text" id="resultLabel"></div>
        <button class="equal num">=</button>


        <div class="nums">
            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
            <button class="num sign">+</button>

            <button class="num">4</button>
            <button class="num">5</button>
            <button class="num">6</button>
            <button class="num sign">-</button>

            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
            <button class="num sign">*</button>

            <button class="num">.</button>
            <button class="num">0</button>
            <button class="num clear sign">C</button>
            <button class="num sign">/</button>
        </div>
        
        

    

    </div>
   

    <script src="calc.js"></script>
    <script src="../More/mode.js"></script>
</body>
</html>
